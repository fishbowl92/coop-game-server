services:
  postgres:
    image: postgres:17-alpine
    container_name: coopgame-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Windows의 동적 예약 포트와 충돌하지 않도록 호스트에서는 15432를 사용합니다.
      # 127.0.0.1에만 바인딩하여 같은 네트워크의 다른 PC에는 DB 포트를 공개하지 않습니다.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: coopgame-redis
    ports:
      # Redis도 로컬 개발 PC에서만 접근할 수 있도록 루프백 주소에 제한합니다.
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
